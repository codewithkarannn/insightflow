services:
  # 1. InsightFlow.Nl2Sql Library Test & Package Builder
  lib-tests:
    build:
      context: .
      dockerfile: InsightFlow.Nl2Sql/Dockerfile
    container_name: insightflow-lib-tests

  # 2. InsightFlow.Api Web API (.NET 10)
  api:
    build:
      context: .
      dockerfile: InsightFlow.Api/Dockerfile
    container_name: insightflow-api
    ports:
      - "5182:8080"
    environment:
      - NL2SQL_API_KEY=${NL2SQL_API_KEY}
      - NL2SQL_BASE_URL=${NL2SQL_BASE_URL:-https://openrouter.ai/api/v1}
      - NL2SQL_MODEL_NAME=${NL2SQL_MODEL_NAME:-openai/gpt-4o-mini}
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped

  # 3. InsightFlowStudio Frontend (Angular + Nginx)
  studio:
    build:
      context: ./InsightFlowStudio
      dockerfile: Dockerfile
    container_name: insightflow-studio
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped
